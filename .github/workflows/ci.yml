name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file is tracked by git
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "These secret files are committed to the repository:"
            echo "$tracked"
            echo "Remove them with: git rm --cached <file>, then ROTATE every credential inside."
            exit 1
          fi
          echo "No .env files are tracked."

  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run tests (no database needed; models are mocked)
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (warnings are errors when CI=true)
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
      # Informational only: Create React App's toolchain has known advisories (see README).
      - name: Audit (informational)
        run: npm audit --omit=dev || true
